name: Operator dispatch to Forgejo candidate CI
run-name: ${{ format('Stage 1 operator request={0}', fromJSON(inputs.request).request_id) }}
on:
  workflow_dispatch:
    inputs:
      request:
        description: Frozen Stage 1 request JSON from the operator ledger
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: gate
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TauCetiProject/TauCetiTools
          ref: d0a464c74bd1e73ad2bed538e9e1b65f7fd4a682
          persist-credentials: false
          path: tools
      - name: Validate protected policy and freeze the dispatch intent
        env:
          PYTHONPATH: tools
          REQUEST: ${{ inputs.request }}
          CALLER_REF: ${{ github.ref }}
          CALLER_SHA: ${{ github.workflow_sha }}
          EXECUTION_JOB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY_VALIDATE'
          import json,os,urllib.request
          from pathlib import Path
          from tauceti_tools.ci_candidate_evidence import NoRedirect
          opener=urllib.request.build_opener(NoRedirect)
          from tauceti_tools.ci_candidate import CandidateRequest,ExecutionPolicy,canonical,read_json
          policy=ExecutionPolicy.parse(read_json(Path('gate/.tauceti/ci-source.json').read_bytes()),configuration=Path('gate/tauceti.toml').read_bytes())
          request=CandidateRequest.parse(read_json(os.environ['REQUEST'].encode()),policy=policy)
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          require(os.environ['GITHUB_REPOSITORY']==policy.execution.repository.name, 'Wrong execution repository')
          require(os.environ['GITHUB_REPOSITORY_ID']==str(policy.execution.native_id), 'Wrong execution repository ID')
          require(os.environ['CALLER_REF']=='refs/heads/'+policy.execution_branch, 'Wrong execution branch')
          require(request.workflow_revision==os.environ['CALLER_SHA'], 'Protected caller revision changed')
          attempt=int(os.environ['GITHUB_RUN_ATTEMPT'])
          require(1 <= attempt <= 10, 'Reconcile excessive parent attempts explicitly')
          # A rerun of THIS parent has the same platform-bound inputs. Permit
          # it only if every earlier attempt demonstrably skipped the POST.
          # A failed/cancelled send is uncertain and must never be repeated.
          for previous in range(1, attempt):
              url=('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+
                   '/actions/runs/'+os.environ['GITHUB_RUN_ID']+'/attempts/'+str(previous)+'/jobs?per_page=100')
              query=urllib.request.Request(url, headers={
                  'Authorization':'Bearer '+os.environ['EXECUTION_JOB_TOKEN'],
                  'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',
                  'Cache-Control':'no-cache'})
              with opener.open(query, timeout=30) as response:
                  raw=response.read(1024*1024+1)
                  require(response.status==200 and len(raw)<=1024*1024, 'Incomplete previous parent evidence')
                  jobs=json.loads(raw)
              require(type(jobs.get('total_count')) is int and jobs['total_count']==1
                      and isinstance(jobs.get('jobs'),list) and len(jobs['jobs'])==1,
                      'Previous parent job evidence is incomplete')
              job=jobs['jobs'][0]
              sends=[step for step in job.get('steps',[])
                     if step.get('name')=="Dispatch with this repository's native job token"]
              require(job.get('status')=='completed' and len(sends)==1
                      and sends[0].get('conclusion')=='skipped',
                      'Previous parent may have sent the event; observe the original child instead')
          Path(os.environ['RUNNER_TEMP'],'dispatch-intent.json').write_bytes(canonical(request.dispatch()))
          PY_VALIDATE
      - name: Retain the exact dispatch intent before sending
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage1-dispatch-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dispatch-intent.json
          if-no-files-found: error
      - name: Dispatch with this repository's native job token
        env:
          PYTHONPATH: tools
          EXECUTION_JOB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY_SEND'
          import json,os,urllib.request
          from pathlib import Path
          from tauceti_tools.ci_candidate_evidence import NoRedirect
          opener=urllib.request.build_opener(NoRedirect)
          data=Path(os.environ['RUNNER_TEMP'],'dispatch-intent.json').read_bytes()
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/dispatches',data=data,method='POST',headers={'Authorization':'Bearer '+os.environ['EXECUTION_JOB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with opener.open(request,timeout=30) as response:
              if response.status!=204:
                  raise SystemExit('Unexpected dispatch acknowledgement; reconcile without resending')
          print('Frozen source candidate event accepted; verify its child receipt/result before promotion')
          PY_SEND

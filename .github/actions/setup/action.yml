name: Prepare shared Tau Ceti tools
description: Run this action's own shared tools and materialize trusted scripts using base-owned configuration
inputs:
  tools-repository:
    required: true
  tools-ref:
    description: Ignored and kept for existing callers; the tools are the revision of this action itself
    required: false
  project-directory:
    default: .
  source-mirror-enabled:
    description: Use the protected qualified post-merge contract for a Forgejo source
    default: "false"
runs:
  using: composite
  steps:
    # Lake compiles C sources (doc-gen4's leansqlite, MD4Lean and UnicodeBasic, for instance)
    # with the system `cc`, not the toolchain's bundled clang. GitHub's images and current Fleet
    # images have one; a Fleet VM from an older base image does not, so install it there.
    - name: Ensure a system C compiler
      shell: bash
      run: |
        set -euo pipefail
        if command -v cc >/dev/null 2>&1; then
          cc --version | sed -n 1p
          exit 0
        fi
        if [ "$(uname -s)" != Linux ] || ! command -v apt-get >/dev/null 2>&1; then
          echo "::error::no system cc on this $(uname -s) runner, and no apt-get to install one; provide a C compiler in the runner image (on macOS: xcode-select --install)"
          exit 1
        fi
        if ! command -v sudo >/dev/null 2>&1 || ! sudo -n true 2>/dev/null; then
          echo "::error::no system cc on this runner, and passwordless sudo is unavailable to install gcc; provide a C compiler in the runner image"
          exit 1
        fi
        echo "::notice::no system cc on this runner; installing gcc"
        sudo -n env DEBIAN_FRONTEND=noninteractive apt-get update -qq
        sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc libc6-dev
        cc --version | sed -n 1p
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PROJECT_DIRECTORY: ${{ inputs.project-directory }}
        SOURCE_MIRROR_ENABLED: ${{ inputs.source-mirror-enabled }}
        TOOLS_REPOSITORY: ${{ inputs.tools-repository }}
      run: |
        set -euo pipefail
        # The action's own checkout is the shared tools: one revision, resolved once by `uses:`.
        tools_directory="$(cd "$ACTION_PATH/../../.." && pwd)"
        project_directory="$GITHUB_WORKSPACE/$PROJECT_DIRECTORY"
        # Helper checkouts must never be swept into a caller's generated commit.
        if git -C "$project_directory" rev-parse --git-dir >/dev/null 2>&1; then
          (cd "$project_directory"; printf '%s\n' '.tauceti-tools/' '.tauceti-project/' '.tauceti-rubrics/' >> "$(git rev-parse --git-path info/exclude)")
        fi
        export PYTHONPATH="$tools_directory${PYTHONPATH:+:$PYTHONPATH}"
        if [ "$SOURCE_MIRROR_ENABLED" = true ]; then
          python3 -m tauceti_tools.ci_mirror_workflow bootstrap \
            --configuration "$project_directory/tauceti.toml" \
            --policy "$project_directory/.tauceti/ci-source.json" \
            --scripts "$RUNNER_TEMP/tauceti-shared-scripts" --policy-dir "$project_directory/scripts" \
            --github-env "$GITHUB_ENV" --provenance "$RUNNER_TEMP/source-mirror-context.json" \
            --harness-repository "$TOOLS_REPOSITORY"
        elif [ "$SOURCE_MIRROR_ENABLED" = false ]; then
          python3 -m tauceti_tools config environment --conf "$project_directory/tauceti.toml" --github-env "$GITHUB_ENV"
          python3 -m tauceti_tools materialize "$RUNNER_TEMP/tauceti-shared-scripts" --conf "$project_directory/tauceti.toml" --policy-dir "$project_directory/scripts"
        else
          echo '::error::source-mirror-enabled must be an explicit true or false'
          exit 1
        fi
        cp -a "$RUNNER_TEMP/tauceti-shared-scripts/." "$project_directory/scripts/"
        echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
    - if: ${{ inputs.source-mirror-enabled == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: source-mirror-context-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        path: ${{ runner.temp }}/source-mirror-context.json
        if-no-files-found: error
        retention-days: 7

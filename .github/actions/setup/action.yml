name: Prepare shared Tau Ceti tools
description: Install pinned shared tools and materialize trusted scripts using base-owned configuration
inputs:
  tools-repository:
    required: true
  tools-ref:
    required: true
  project-directory:
    default: .
  source-mirror-enabled:
    description: Use the protected qualified post-merge contract for a Forgejo source
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: ${{ inputs.tools-repository }}
        ref: ${{ inputs.tools-ref }}
        path: .tauceti-tools
        persist-credentials: false
    - shell: bash
      env:
        PROJECT_DIRECTORY: ${{ inputs.project-directory }}
        SOURCE_MIRROR_ENABLED: ${{ inputs.source-mirror-enabled }}
        TOOLS_REPOSITORY: ${{ inputs.tools-repository }}
        TOOLS_REVISION: ${{ inputs.tools-ref }}
      run: |
        set -euo pipefail
        tools_directory="$GITHUB_WORKSPACE/.tauceti-tools"
        project_directory="$GITHUB_WORKSPACE/$PROJECT_DIRECTORY"
        # Helper checkouts must never be swept into a caller's generated commit.
        if git -C "$project_directory" rev-parse --git-dir >/dev/null 2>&1; then
          (cd "$project_directory"; printf '%s\n' '.tauceti-tools/' '.tauceti-project/' '.tauceti-rubrics/' >> "$(git rev-parse --git-path info/exclude)")
        fi
        export PYTHONPATH="$tools_directory${PYTHONPATH:+:$PYTHONPATH}"
        if [ "$SOURCE_MIRROR_ENABLED" = true ]; then
          test "$(git -C "$tools_directory" rev-parse HEAD)" = "$TOOLS_REVISION"
          python3 -m tauceti_tools.ci_mirror_workflow bootstrap \
            --configuration "$project_directory/tauceti.toml" \
            --policy "$project_directory/.tauceti/ci-source.json" \
            --scripts "$RUNNER_TEMP/tauceti-shared-scripts" --policy-dir "$project_directory/scripts" \
            --github-env "$GITHUB_ENV" --provenance "$RUNNER_TEMP/source-mirror-context.json" \
            --harness-repository "$TOOLS_REPOSITORY" --harness-sha "$TOOLS_REVISION"
        elif [ "$SOURCE_MIRROR_ENABLED" = false ]; then
          python3 -m tauceti_tools config environment --conf "$project_directory/tauceti.toml" --github-env "$GITHUB_ENV"
          python3 -m tauceti_tools materialize "$RUNNER_TEMP/tauceti-shared-scripts" --conf "$project_directory/tauceti.toml" --policy-dir "$project_directory/scripts"
        else
          echo '::error::source-mirror-enabled must be an explicit true or false'
          exit 1
        fi
        cp -a "$RUNNER_TEMP/tauceti-shared-scripts/." "$project_directory/scripts/"
        echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
    - if: ${{ inputs.source-mirror-enabled == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: source-mirror-context-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        path: ${{ runner.temp }}/source-mirror-context.json
        if-no-files-found: error
        retention-days: 7

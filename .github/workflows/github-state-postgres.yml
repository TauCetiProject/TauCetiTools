name: github-state-postgres
# The real-database suite costs about 30 hosted job-minutes a run, so PRs run it only when they
# change the service it tests (or this workflow); every main push still runs it.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - services/github-state/**
      - .github/workflows/github-state-postgres.yml
concurrency:
  group: github-state-postgres-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  github-state-postgres:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # Real database round trips are materially slower from GitHub-hosted runners
    # than the previous Namespace placement. Keep a finite full-suite budget.
    timeout-minutes: 60
    env:
      # Isolated test-branch credentials only; no Neon API key or production URL.
      TEST_POSTGRES_URL: ${{ secrets.STATE_TEST_POSTGRES_URL }}
      TEST_POSTGRES_MIGRATION_URL: ${{ secrets.STATE_TEST_POSTGRES_MIGRATION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run test:postgres
        env:
          POSTGRES_TEST_REPORT: ${{ runner.temp }}/postgres-test-results.xml
        working-directory: services/github-state
      - name: Upload PostgreSQL test timings
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/postgres-test-results.xml
          if-no-files-found: warn
          retention-days: 7

name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # Reuse small Namespace runners rather than queue release fixes behind GitHub builds.
  # Leave priority unspecified so Bors control (0) and staging builds (1) go first.
  package:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features
      - namespace-features:github.run-id=${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p 'test_*.py'
  github-state:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features
      - namespace-features:github.run-id=${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm test && npm run test:publication-memory
        working-directory: services/github-state

  github-state-postgres:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features
      - namespace-features:github.run-id=${{ github.run_id }}
    timeout-minutes: 20
    env:
      # Isolated test-branch credentials only; no Neon API key or production URL.
      TEST_POSTGRES_URL: ${{ secrets.STATE_TEST_POSTGRES_URL }}
      TEST_POSTGRES_MIGRATION_URL: ${{ secrets.STATE_TEST_POSTGRES_MIGRATION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run test:postgres
        working-directory: services/github-state

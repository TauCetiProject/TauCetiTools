name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bubblewrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[test]'
      - name: Install bundled package and prove sandbox isolation
        env:
          BWRAP_LIVE_INSTALL: '1'
        run: python -m unittest discover -s tests -p test_bwrap_bundle.py -v
  workflow-identity:
    uses: ./.github/workflows/check-workflow-identity.yml
    with:
      caller_repository: ${{ github.repository }}
      caller_revision: ${{ github.workflow_sha }}
  # Reuse small Namespace runners rather than queue release fixes behind GitHub builds.
  # Leave priority unspecified so Bors control (0) and staging builds (1) go first.
  package:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features
      - namespace-features:github.run-id=${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[test]'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: PYTHONPATH=tauceti_tools/assets/scripts python tauceti_tools/assets/scripts/test_lint_dot_notation.py
  axiom-audit:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features
      - namespace-features:github.run-id=${{ github.run_id }}
    timeout-minutes: 15
    env:
      ELAN_TOOLCHAIN: leanprover/lean4:v4.36.0-rc2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned elan
        env:
          ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_VER: v4.2.3
        run: |
          if ! curl --fail --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 -sSL -H "Accept: application/octet-stream" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VER}/elan-x86_64-unknown-linux-gnu.tar.gz?download=1" -o elan.tar.gz; then
            curl --fail --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 -sSL -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/leanprover/elan/releases/assets/441516216" -o elan.tar.gz
          fi
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          rm -f elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check compiled declarations with stock Lean
        run: |
          elan toolchain install "$ELAN_TOOLCHAIN"
          fixture_root="$RUNNER_TEMP/axiom-audit"
          mkdir -p "$fixture_root"
          printf '%s\n' "$ELAN_TOOLCHAIN" > "$fixture_root/lean-toolchain"
          bash tauceti_tools/assets/scripts/build-audit-driver.sh \
            "$fixture_root" tauceti_tools/assets/scripts "$fixture_root/native"
          export LEAN="$(elan which lean)"
          export LEAN_SYSROOT="$(lean --print-prefix)"
          export AUDIT_DRIVER_EXE="$fixture_root/native/audit-driver"
          export LOCAL_AXIOMS_EXE="$fixture_root/native/local-axioms"
          python tauceti_tools/assets/scripts/test_duplicate_declarations.py
          python -m unittest discover -s tests -p test_local_axioms.py
      - name: Verify bulk restoration and native publication with stock Lake
        run: python tauceti_tools/assets/scripts/test_bulk_unpack_cache.py --integration
  github-state:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features
      - namespace-features:github.run-id=${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm test && npm run test:publication-memory
        working-directory: services/github-state

  github-state-postgres:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features
      - namespace-features:github.run-id=${{ github.run_id }}
    timeout-minutes: 20
    env:
      # Isolated test-branch credentials only; no Neon API key or production URL.
      TEST_POSTGRES_URL: ${{ secrets.STATE_TEST_POSTGRES_URL }}
      TEST_POSTGRES_MIGRATION_URL: ${{ secrets.STATE_TEST_POSTGRES_MIGRATION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run test:postgres
        working-directory: services/github-state

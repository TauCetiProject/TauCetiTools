name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bubblewrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[test]'
      - name: Install bundled package and prove sandbox isolation
        env:
          BWRAP_LIVE_INSTALL: '1'
        run: python -m unittest discover -s tests -p test_bwrap_bundle.py -v
  workflow-identity:
    uses: ./.github/workflows/check-workflow-identity.yml
    with:
      caller_repository: ${{ github.repository }}
      caller_revision: ${{ github.workflow_sha }}
  # Package and audit checks use GitHub-hosted capacity.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[test]'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: PYTHONPATH=tauceti_tools/assets/scripts python tauceti_tools/assets/scripts/test_lint_dot_notation.py
      - run: PYTHONPATH=tauceti_tools/assets/scripts python tauceti_tools/assets/scripts/test_claims_access.py
  axiom-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELAN_TOOLCHAIN: leanprover/lean4:v4.36.0-rc2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned elan
        env:
          ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_VER: v4.2.3
        run: |
          if ! curl --fail --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 -sSL -H "Accept: application/octet-stream" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VER}/elan-x86_64-unknown-linux-gnu.tar.gz?download=1" -o elan.tar.gz; then
            curl --fail --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 -sSL -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/leanprover/elan/releases/assets/441516216" -o elan.tar.gz
          fi
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          rm -f elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check compiled declarations with stock Lean
        run: |
          elan toolchain install "$ELAN_TOOLCHAIN"
          fixture_root="$RUNNER_TEMP/axiom-audit"
          mkdir -p "$fixture_root"
          printf '%s\n' "$ELAN_TOOLCHAIN" > "$fixture_root/lean-toolchain"
          bash tauceti_tools/assets/scripts/build-audit-driver.sh \
            "$fixture_root" tauceti_tools/assets/scripts "$fixture_root/native"
          export LEAN="$(elan which lean)"
          export LEAN_SYSROOT="$(lean --print-prefix)"
          export AUDIT_DRIVER_EXE="$fixture_root/native/audit-driver"
          export LOCAL_AXIOMS_EXE="$fixture_root/native/local-axioms"
          python tauceti_tools/assets/scripts/test_duplicate_declarations.py
          python -m unittest discover -s tests -p test_local_axioms.py
      - name: Verify bulk restoration and native publication with stock Lake
        run: python tauceti_tools/assets/scripts/test_bulk_unpack_cache.py --integration
  # Lean, Lake and header fixtures that need a real Mathlib project. TauCeti `main` supplies the
  # project; every script under test is this revision's, materialized over its `scripts/` by setup.
  project-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BWRAP_VER: 0.9.0-1build1
      BWRAP_DEB_SHA256: dde30d1f24da50446d647ed504ec8dc5a714f171974d054c70a589b48ba38b48
      BWRAP_SHA256: 3e33f8255e1411ada346db27028c25ef5ba4fa3327754a2321ea4c8732a3bc10
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TauCetiProject/TauCeti
          ref: main
          path: project
          persist-credentials: false
      - name: Materialize this revision's scripts into the project
        uses: ./tools/.github/actions/setup
        with:
          tools-repository: ${{ github.repository }}
          project-directory: project
      - name: Install the bundled bubblewrap
        run: |
          set -euo pipefail
          deb="bubblewrap_${BWRAP_VER}_amd64.deb"
          cp "$RUNNER_TEMP/tauceti-shared-scripts/vendor/$deb" bwrap.deb
          echo "${BWRAP_DEB_SHA256}  bwrap.deb" | sha256sum -c -
          sudo dpkg -i bwrap.deb >/dev/null
          echo "${BWRAP_SHA256}  /usr/bin/bwrap" | sha256sum -c -
          rm -f bwrap.deb
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
              'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' \
              | sudo tee /etc/apparmor.d/bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          /usr/bin/bwrap --version
      - name: Install pinned elan and the project toolchain
        env:
          ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_VER: v4.2.3
        run: |
          if ! curl --fail --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 -sSL -H "Accept: application/octet-stream" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VER}/elan-x86_64-unknown-linux-gnu.tar.gz?download=1" -o elan.tar.gz; then
            curl --fail --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 -sSL -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/leanprover/elan/releases/assets/441516216" -o elan.tar.gz
          fi
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          rm -f elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat project/lean-toolchain)"
      - name: Import, checkout and Lake publication fixtures
        working-directory: project
        run: |
          export ELAN_TOOLCHAIN="$(cat lean-toolchain)"
          LEAN="$(elan which lean)"
          LEAN_SYSROOT="$("$LEAN" --print-prefix)"
          export LEAN LEAN_SYSROOT
          # An explicit native test must not silently skip for absent tools.
          command -v bwrap
          test -x "$LEAN_SYSROOT/bin/lake"
          python3 scripts/test_check_imports.py
          python3 scripts/test_ci_checkout.py --integration
          python3 scripts/test_lake_cache_publish.py --integration
      - name: Full versus shadow audit fixtures
        working-directory: project
        run: |
          LEAN="$(elan which lean)"
          LEAN_SYSROOT="$("$LEAN" --print-prefix)"
          export LEAN LEAN_SYSROOT
          export SHADOW_REPORT="$RUNNER_TEMP/shadow-audit-report.json"
          python3 scripts/test_shadow_audits.py
      - name: Fetch Mathlib for the header and lint fixtures
        working-directory: project
        run: lake exe cache get
      - name: Header audit equivalence tests
        working-directory: project
        run: lake env python3 scripts/test_header_style.py
      - name: Downstream unused-argument lint regression
        working-directory: project
        run: |
          out="$RUNNER_TEMP/downstream-lint-driver"
          bash scripts/build-lint-driver.sh . scripts/LintEnvDriver.lean "$out"
          python3 scripts/test_downstream_unused_arguments.py . "$out/lint-env-driver"

  github-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm test && npm run test:publication-memory
        working-directory: services/github-state

  github-state-postgres:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # Real database round trips are materially slower from GitHub-hosted runners
    # than the previous Namespace placement. Keep a finite full-suite budget.
    timeout-minutes: 60
    env:
      # Isolated test-branch credentials only; no Neon API key or production URL.
      TEST_POSTGRES_URL: ${{ secrets.STATE_TEST_POSTGRES_URL }}
      TEST_POSTGRES_MIGRATION_URL: ${{ secrets.STATE_TEST_POSTGRES_MIGRATION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run test:postgres
        env:
          POSTGRES_TEST_REPORT: ${{ runner.temp }}/postgres-test-results.xml
        working-directory: services/github-state
      - name: Upload PostgreSQL test timings
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/postgres-test-results.xml
          if-no-files-found: warn
          retention-days: 7

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tauceti-tools"
version = "0.1.0"
description = "Shared configuration, CI and administration for Tau Ceti projects"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]
license = "Apache-2.0"

[project.optional-dependencies]
test = ["PyYAML>=6"]

[project.scripts]
tauceti-tools = "tauceti_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tauceti_tools"]


[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

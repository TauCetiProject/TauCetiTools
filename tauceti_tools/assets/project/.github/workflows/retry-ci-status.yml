name: Retry CI status publication

# Replay retained statuses, and recover abandoned PR builds on the existing workflow.
on:
  workflow_run:
    workflows: [pr-build]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      source_run_id: {description: "Completed original build run", type: string, default: ""}
      source_attempt: {description: "Original run attempt", type: string, default: "1"}

permissions:
  contents: read
  actions: write
  pull-requests: read
  statuses: write

jobs:
  publish:
    uses: __TOOLS_REPO__/.github/workflows/retry-ci-status.yml@__TOOLS_REF__
    with:
      source_run_id: ${{ inputs.source_run_id || '' }}
      source_attempt: ${{ inputs.source_attempt || '1' }}
      tools_repository: __TOOLS_REPO__
      tools_ref: __TOOLS_REF__
      project_ref: ${{ github.workflow_sha }}
    secrets:
      CI_READ_APP_ID: ${{ secrets.CI_READ_APP_ID }}
      CI_READ_APP_PRIVATE_KEY: ${{ secrets.CI_READ_APP_PRIVATE_KEY }}
      CI_STATUS_APP_ID: ${{ secrets.CI_STATUS_APP_ID }}
      CI_STATUS_APP_PRIVATE_KEY: ${{ secrets.CI_STATUS_APP_PRIVATE_KEY }}

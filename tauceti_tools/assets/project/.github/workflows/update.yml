name: Update Dependencies

# Pick a recent fully cached master commit, then keep it fixed while workers repair
# TauCeti. downstream-reports remains external reporting, never a target selector.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Verify and print the target without publishing"
        type: boolean
        default: false

concurrency:
  group: mathlib-bump-reconciliation
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  recover-maintenance:
    if: ${{ !inputs.dry-run }}
    runs-on: __MAINTENANCE_RUNNER__
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Prepare pinned shared tools
        uses: __TOOLS_REPO__/.github/actions/setup@__TOOLS_REF__
        with:
          tools-repository: __TOOLS_REPO__
          tools-ref: __TOOLS_REF__
          project-directory: .
      - name: Recover maintenance PRs abandoned without a build status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/maintenance_builds.py

  select:
    runs-on: __MAINTENANCE_RUNNER__
    timeout-minutes: 60
    outputs:
      target: ${{ steps.target.outputs.target }}
      run_id: ${{ steps.target.outputs.run_id }}
      reconcile: ${{ steps.target.outputs.reconcile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Prepare pinned shared tools
        uses: __TOOLS_REPO__/.github/actions/setup@__TOOLS_REF__
        with:
          tools-repository: __TOOLS_REPO__
          tools-ref: __TOOLS_REF__
          project-directory: .
      - name: Install checksum-verified elan
        env:
          ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_VER: v4.2.3
          ELAN_ASSET_ID: 441516216
        run: |
          if ! curl --fail --silent --show-error --location --retry 2 --retry-all-errors --retry-delay 1 --connect-timeout 10 --max-time 60 --retry-max-time 120 \
              -H "Accept: application/octet-stream" \
              "https://github.com/leanprover/elan/releases/download/${ELAN_VER}/elan-x86_64-unknown-linux-gnu.tar.gz" -o elan.tar.gz; then
            curl --fail --silent --show-error --location --retry 2 --retry-all-errors --retry-delay 1 --connect-timeout 10 --max-time 60 --retry-max-time 120 \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/leanprover/elan/releases/assets/${ELAN_ASSET_ID}" -o elan.tar.gz
          fi
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          rm -f elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Select and verify the newest complete Mathlib cache
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/bump_latest.py --select

  publish:
    needs: select
    if: needs.select.outputs.reconcile == 'true' && !inputs.dry-run
    runs-on: __MAINTENANCE_RUNNER__
    steps:
      # No upstream code executes in this job, and the selection job has no App secret.
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject
          repositories: TauCeti
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0
      - name: Prepare pinned shared tools
        uses: __TOOLS_REPO__/.github/actions/setup@__TOOLS_REF__
        with:
          tools-repository: __TOOLS_REPO__
          tools-ref: __TOOLS_REF__
          project-directory: .
      - name: Publish the fixed-target bump
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET: ${{ needs.select.outputs.target }}
          RUN_ID: ${{ needs.select.outputs.run_id }}
        run: python3 scripts/bump_latest.py --publish "$TARGET" --run-id "$RUN_ID"
